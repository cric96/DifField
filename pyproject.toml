[project]
name = "diffield"
version = "0.1.0"
description = "Differentiable field calculus and aggregate computing on graphs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch-geometric>=2.6",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "optuna>=3.6",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
decentralized = [
    "mesa>=3.5",
    "networkx>=3",
]
vmas = [
    "vmas>=1.5.2",
]
cpu = [
    "torch>=2.0",
    "torchvision",
    "torchaudio",
]
cuda = [
    "torch>=2.0",
    "torchvision",
    "torchaudio",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "hypothesis>=6.100.0",
    "ipykernel>=6.29.5",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "TCH",
    "RUF",
    "TRY",
    "PL",
    "S",
]
ignore = [
    "PLR0913",
    "PLR2004",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportPrivateImportUsage = false
reportPossiblyUnboundVariable = "warning"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
