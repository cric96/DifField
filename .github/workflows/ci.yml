name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"  # uv run would install the default groups back
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Without the experiments' dependencies: the library must not need them.
      - name: Install the library
        run: uv sync --extra cpu --extra decentralized --no-group examples

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check types with pyright
        run: uv run pyright

      - name: Test the library
        run: uv run pytest tests

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the library and the experiments
        run: uv sync --extra cpu --extra decentralized --extra vmas

      - name: Test the experiments
        run: uv run pytest examples
